name: Enviar notificação push

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enviar push das novidades novas
        env:
          NINA_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/enviar-push.js --auto
      - name: Registrar o envio
        run: |
          git config user.name "NINA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ultimo-push.json
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Registra push enviado"
            git push
          fi
