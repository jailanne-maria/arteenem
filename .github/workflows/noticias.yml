name: Atualizar notícias do MEC

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/buscar-noticias.js
      - run: |
          git config user.name "NINA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add noticias.json
          if git diff --staged --quiet; then
            echo "Sem novidades."
          else
            git commit -m "Atualiza notícias do MEC"
            git push
          fi
