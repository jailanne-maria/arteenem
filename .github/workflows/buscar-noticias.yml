name: Atualizar notícias

on:
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar notícias e gerar os temas de redação
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/buscar-noticias.js
      - name: Publicar noticias.json
        run: |
          git config user.name "NINA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add noticias.json
          if git diff --staged --quiet; then
            echo "Sem novidades."
          else
            git commit -m "Atualiza noticias e temas de redacao"
            git push
          fi
